#
# Moscow Watch — indicator definitions.
#
# An indicator is a named quantity, from a named source, with a value, a timestamp, a date
# on which it becomes decidable, and a stated direction of implication for each hypothesis.
#
# There are no scoring rules in this file, because there is no scoring. `bears_on` records
# which way a move would point if it happened. It does not weight anything, and nothing
# here is summed into a verdict. The repo publishes; the article interprets.
#

[project]
name = "Moscow Watch"
# The 25 August 2026 Ratcliffe visit to Moscow. Everything is measured against this.
event_date = "2026-08-25"
news_timespan = "3d"
stale_after_hours = 12
# Never report a move computed over a shorter window than this. A half-point move over a
# three-minute window is noise, and reporting it as news discredits the whole page.
min_change_window_hours = 6
max_discovery_queries = 2
discovery_min_interval_seconds = 6
# Fortnight buckets for the contact counter are measured from here.
contact_anchor = "2026-01-05"
# The pre-event baseline for the reporting-volume index. RSS exposes only a few days, so
# the baseline is assembled from GDELT DOC 2.0 in timelinevol mode by `mw backfill
# --engagement`, and it stops the day before the visit.
engagement_baseline_start = "2026-01-01"
engagement_baseline_end = "2026-08-24"

# ---------------------------------------------------------------------------
# HYPOTHESES
#
# Six tracked, one named and excluded. Each carries a falsifier and a date, because
# committing to what would change your mind, in advance, is the only thing that
# distinguishes a tracker from a narrative.
# ---------------------------------------------------------------------------

[[hypotheses]]
id = "h1"
name = "Uranium custody"
claim = "Washington is exploring, through Moscow, a route to account for and remove Iran's unaccounted enriched uranium, reviving the 2015 mechanism in which Russia took custody of Iranian material."
falsifier = "No IAEA, Rosatom or US statement referencing third-party custody, transfer or accounting of Iranian material by 31 October 2026."
falsifier_date = "2026-10-31"

[[hypotheses]]
id = "h2"
name = "Ukraine endgame"
claim = "The trip prepared a Ukraine settlement or a Trump-Putin meeting, explored deniably because the formal track has been suspended since February 2026."
falsifier = "No announced meeting, no resumption of the trilateral track, and no near-dated change in the Polymarket ceasefire term structure by 31 October 2026."
falsifier_date = "2026-10-31"

[[hypotheses]]
id = "h3"
name = "Iran-for-Ukraine bargain"
claim = "Reciprocal costly concessions: Washington gives Russia room in Ukraine while Moscow reduces the support that makes Iran harder to pressure."
falsifier = "Continued or increased Russian engagement with Tehran alongside continued US costs on Russia, through 30 November 2026. This hypothesis already starts behind: US intelligence sharing with Ukraine was restored to full levels on 17 August 2026, which is the opposite of its American leg."
falsifier_date = "2026-11-30"

[[hypotheses]]
id = "h4"
name = "Brokerage"
claim = "Washington asked Moscow to carry messages to, or mediate with, Tehran. Not a trade and not a withdrawal of Russian support, but an increase in Russian engagement at American request."
falsifier = "Reported Russia-Iran contacts have not risen above the pre-25-August baseline by 31 October 2026, and US-Iran talks have not resumed."
falsifier_date = "2026-10-31"

[[hypotheses]]
id = "h5"
name = "Warning"
claim = "Ratcliffe delivered a warning about Russian intelligence support to Iranian forces targeting American assets. Coercion, not cooperation."
falsifier = "No new US costs imposed on Russia, and no reported reduction in Russian targeting support, by 31 October 2026."
falsifier_date = "2026-10-31"

[[hypotheses]]
id = "h6"
name = "Channel maintenance"
claim = "Ordinary intelligence-service business: prisoners, counterterrorism, embassy staffing, or re-establishing a working channel. There is no US ambassador in Moscow, and 7.5 hours on the ground with no Putin meeting fits working-level business."
falsifier = "Any documented substantive outcome on Iran, uranium or Ukraine attributable to the visit by 31 October 2026."
falsifier_date = "2026-10-31"

[[hypotheses]]
id = "h7"
name = "Arms control"
claim = "New START expired on 5 February 2026 with no successor, and no strategic stability talks exist. This is the most consequential unattended file in the US-Russia relationship and a plausible reason to send an intelligence chief."
scored = false
note = "Named and set aside, not quietly promoted to a testable hypothesis. No outlet has reported it as an agenda item, and there is no prediction market on arms control on either venue. If a market on a New START successor appears, it moves into the tracked set."

