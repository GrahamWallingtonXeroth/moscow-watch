[[indicators]]
id = "pm_ukraine_ceasefire_ladder"
name = "Polymarket: Russia-Ukraine ceasefire term structure"
source = "polymarket"
kind = "market_ladder"
event_slug = "russia-x-ukraine-ceasefire-agreement-by"
material_move = 0.03
note = "Read as a ladder, not a price. A parallel shift is sentiment; a change in the shape of the forward hazard curve is news about timing. The far legs are thin - under $5,000 of volume - so treat the Q1-2027 peak with the caution that deserves."
