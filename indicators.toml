# ---------------------------------------------------------------------------
# DISCOVERY — GDELT
#
# Two broad, paced queries. Discovery may never promote a claim on its own: an index is a
# pointer to a story, not an independent witness to it.
# ---------------------------------------------------------------------------

[[discovery_queries]]
id = "russia_ukraine_nato"
title = "Russia, Ukraine and NATO theatre"
query = "(Russia OR Russian OR Moscow) (Ukraine OR NATO) (sanctions OR ceasefire OR escalation OR intelligence OR weapons OR strikes)"
max_records = 250

[[discovery_queries]]
id = "russia_iran_hormuz"
title = "Russia, Iran and Hormuz theatre"
query = "(Iran OR Iranian OR Tehran OR Hormuz) (Russia OR Russian OR Washington) (ceasefire OR nuclear OR intelligence OR weapons OR sanctions OR mediation)"
max_records = 250

# ---------------------------------------------------------------------------
