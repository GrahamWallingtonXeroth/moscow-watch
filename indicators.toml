# ---------------------------------------------------------------------------
# INDICATORS — COUNTED QUANTITIES
# ---------------------------------------------------------------------------

[[indicators]]
id = "portwatch_hormuz_transits"
name = "IMF PortWatch: daily Strait of Hormuz transits"
source = "portwatch"
kind = "counted_quantity"
chokepoint_id = "chokepoint6"
value_field = "n_total"
material_move = 0.20
note = "The project's one counted physical quantity. Updates weekly with roughly a week to ten days of lag, so the newest row is never today, and the lag is printed beside every reading. Counts are currently extraordinarily low, consistent with AIS jamming and dark-vessel behaviour in the strait; this measures observed transits, not all transits."
bears_on = [
  { hypothesis = "h1", direction = "up" },
  { hypothesis = "h4", direction = "up" },
]

[[indicators]]
id = "russia_iran_contacts"
name = "Reported senior Russia-Iran diplomatic contacts per fortnight"
source = "corpus"
kind = "event_count"
value_field = "count"
material_move = 0.50
note = "The directly counted half of what separates H3 from H4. Both predict the same Iran outcomes; what tells them apart is which direction Russian officials are travelling. Counts REPORTED contacts only - unreported diplomacy is exactly what this story is about - so it is a floor, never a total. Every counted contact stores its source URL."
bears_on = [
  { hypothesis = "h4", direction = "up" },
  { hypothesis = "h1", direction = "up" },
  { hypothesis = "h3", direction = "down" },
  { hypothesis = "h5", direction = "down" },
]

# ---------------------------------------------------------------------------
# INDICATORS — REPORTING VOLUME
#
# One indicator, and it is the only place in this file where GDELT supplies a number
# rather than a lead. The distinction it rests on: counting how often a subject is
# reported and attesting that something happened are different operations. This does the
# first. It never does the second.
# ---------------------------------------------------------------------------

[[indicators]]
id = "russia_iran_engagement_volume"
name = "Russia-Iran engagement volume (reporting index)"
source = "gdelt"
kind = "reporting_index"
query = "(Russia OR Russian OR Moscow OR Kremlin OR Lavrov) (Iran OR Iranian OR Tehran OR Araghchi) (talks OR meeting OR visit OR delegation OR consultations OR mediation OR envoy)"
value_field = "mean_volume"
material_move = 0.05
note = "Counts REPORTING VOLUME from a news index - GDELT DOC 2.0 in timelinevol mode - and not contacts. It is a proxy for diplomatic tempo rather than a count of contacts: the value is the share of monitored world coverage matching the query, averaged over the fortnight. Only the DIRECTION of change against the pre-25-August baseline is meaningful; the level carries no meaning on its own. A GDELT hit still cannot attest a claim, because counting volume and attesting a claim are different operations, so nothing here promotes anything. The directly collected contact counter runs alongside it and is the auditable one."
bears_on = [
  { hypothesis = "h4", direction = "up" },
  { hypothesis = "h1", direction = "up" },
  { hypothesis = "h3", direction = "down" },
  { hypothesis = "h5", direction = "down" },
]

