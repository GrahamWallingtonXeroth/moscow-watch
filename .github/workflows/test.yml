name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[charts]" ruff

      - name: Lint
        run: ruff check src tests

      - name: Byte-compile
        run: python -m compileall -q src tests

      - name: Validate indicators.toml
        run: mw check-config

      # Offline only. No test may touch the network.
      - name: Tests
        run: python -m unittest discover -s tests -v

      # Charts must build from the committed ledger on every push.
      - name: Build charts
        run: mw charts --out-dir /tmp/charts
